name: erp_mobile_cnplus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  http: ^1.4.0
  fl_chart: ^1.0.0
  flutter_svg: ^2.0.7
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  syncfusion_flutter_charts: ^34.1.29
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.1.0
  connectivity_plus: ^7.0.0
  logger: ^2.6.1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  equatable: ^2.0.5
  internet_connection_checker: ^1.0.0+1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  flutter_staggered_animations: ^1.1.1
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  get_it: ^9.2.1
  animated_custom_dropdown: ^4.0.0
  permission_handler: ^12.0.1
